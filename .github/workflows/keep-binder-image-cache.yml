name: Keep Binder image on cache

on:
  push:
    branches:
      - main

  # Run every 4 hours
  schedule:
    - cron: "0 */4 * * *" # Every 5 days at 3am UTC

  workflow_dispatch:

jobs:
  warm-binder-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Warm MyBinder cache
        run: |
          set -euxo pipefail

          BINDER_URL="https://mybinder.org/v2/gh/${{ github.repository }}/${{ github.ref_name }}"

          curl --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --fail-with-body \
            "$BINDER_URL"

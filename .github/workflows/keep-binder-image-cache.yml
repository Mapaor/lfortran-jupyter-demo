name: Keep Binder image on cache

on:
  push:
    branches:
      - main

  # Run before Binder's 7-day inactivity
  schedule:
    - cron: "0 3 */5 * *" # Every 5 days at 3am UTC

  workflow_dispatch:

jobs:
  warm-binder-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Warm MyBinder cache
        run: |
            BINDER_URL="https://mybinder.org/build/gh/${{ github.repository }}/${{ github.ref_name }}"
            curl --fail --show-error --silent --location \
              --retry 3 --retry-delay 5 \
              "$BINDER_URL"
